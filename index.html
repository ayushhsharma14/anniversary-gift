<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>For Prateeksha 💗</title>
<link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg1: #ffe6ee; --bg2: #ffbfd2; --text: #5a1230; --red: #c9184a; --pink: #ff7aa2;
  --card: rgba(255,255,255,.82); --paper: #fffaf5;
  --script: "Dancing Script", "Segoe Script", "Apple Chancery", cursive;
  box-sizing: border-box;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) { --bg1: #3a1020; --bg2: #5a1a33; --text: #ffe3ec; --red: #ff6b8e; --card: rgba(255,255,255,.14); --paper: #2b0f1b; }
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; margin: 0; }
body { background: radial-gradient(circle at 50% 30%, var(--bg1), var(--bg2)); color: var(--text); font-family: var(--script); font-weight: 700; text-transform: uppercase; overflow: hidden; }
button { font-family: var(--script); }

/* ---------- background ---------- */
#bg { position: fixed; inset: 0; overflow: hidden; pointer-events: none; z-index: 0; }
#bg .h, #bg .w, #bg .pt { position: absolute; will-change: transform; }
#bg .h { bottom: -70px; animation: rise linear infinite; }
#bg .w { bottom: -60px; font-size: 21px; font-weight: 700; color: var(--red); text-align: center; line-height: 1.2; text-shadow: 0 1px 0 rgba(255,255,255,.7); animation: drift 17s linear forwards; }
@keyframes drift { 0% { transform: translate(0, 0); opacity: 0; } 10% { opacity: .85; } 50% { transform: translate(var(--dx), -55vh); } 85% { opacity: .85; } 100% { transform: translate(0, -118vh); opacity: 0; } }
#bg .sp { position: absolute; animation: twinkle 3s ease-in-out infinite; }
#bg .pt { top: -30px; width: 12px; height: 16px; background: linear-gradient(135deg, #fff, #ff9db8); border-radius: 100% 0 100% 0; opacity: .85; animation: fall linear infinite; }
@keyframes rise { 0% { transform: translate(0, 0) rotate(-8deg); opacity: 0; } 10% { opacity: 1; } 50% { transform: translate(var(--dx), -55vh) rotate(8deg); } 100% { transform: translate(0, -118vh) rotate(-8deg); opacity: 0; } }
@keyframes fall { to { transform: translate(var(--dx), 112vh) rotate(360deg); } }
@keyframes twinkle { 0%, 100% { opacity: .1; transform: scale(.6); } 50% { opacity: 1; transform: scale(1.1); } }
#garden { position: absolute; left: 0; right: 0; bottom: 0; height: 30vh; }
#garden::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 60px; background: linear-gradient(transparent, rgba(255,160,190,.55)); }
.lily { position: absolute; bottom: -6px; transform-origin: bottom center; animation: sway 6s ease-in-out infinite alternate; will-change: transform; }
.lily svg { display: block; overflow: visible; }
@keyframes sway { from { transform: rotate(-3deg); } to { transform: rotate(3deg); } }

/* ---------- screens ---------- */
.screen { position: fixed; inset: 0; z-index: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center;
  padding: calc(20px + env(safe-area-inset-top, 0px)) 20px calc(20px + env(safe-area-inset-bottom, 0px)); }
#hero { opacity: 0; visibility: hidden; transition: opacity 1.2s ease, visibility 0s linear 1.2s; overflow-y: auto; justify-content: flex-start; padding-top: calc(44px + env(safe-area-inset-top, 0px)); }
#hero.show { opacity: 1; visibility: visible; transition-delay: 0s; }

/* ---------- envelope ---------- */
.for { font-size: clamp(44px, 13vw, 64px); font-weight: 700; margin: 0; color: var(--red); line-height: 1.1; text-shadow: 0 2px 0 rgba(255,255,255,.7); }
.stage { position: relative; width: min(90vw, 410px); aspect-ratio: 4 / 3; margin: 56px 0 40px; perspective: 1000px; }
.shadow { position: absolute; left: 6%; right: 6%; bottom: -14px; height: 26px; background: rgba(90,0,30,.4); filter: blur(14px); border-radius: 50%; }
.env { position: absolute; inset: 0; transform-style: preserve-3d; }
.env > div { position: absolute; }
.paper { background-image: repeating-linear-gradient(45deg, rgba(255,255,255,.07) 0 2px, transparent 2px 5px), repeating-linear-gradient(-45deg, rgba(0,0,0,.025) 0 2px, transparent 2px 5px); }
.back { inset: 0; background-color: #e0567d; border-radius: 10px; z-index: 1; box-shadow: 0 14px 26px rgba(110,15,45,.35), inset 0 10px 22px rgba(90,0,30,.45); }
.note { left: 6%; right: 6%; top: 6%; height: 88%; z-index: 2; border-radius: 6px; background-color: var(--paper);
  background-image: repeating-linear-gradient(transparent 0 28px, rgba(201,24,74,.18) 28px 29px); box-shadow: 0 -4px 14px rgba(90,0,30,.25);
  padding: 16px 20px; text-align: left; font-size: 32px; font-weight: 700; line-height: 1.2; color: var(--red); will-change: transform; }
.pocket { inset: 0; z-index: 3; border-radius: 10px; background-color: #ff5c85; background-image: linear-gradient(115deg, rgba(255,255,255,.28), rgba(255,255,255,0) 40%), linear-gradient(245deg, rgba(120,0,40,.28), rgba(120,0,40,0) 45%);
  clip-path: polygon(0 0, 50% 54%, 100% 0, 100% 100%, 0 100%); }
.flap { left: 0; right: 0; top: 0; height: 56%; z-index: 4; background-color: #ff7aa2; background-image: linear-gradient(180deg, rgba(255,255,255,.3), rgba(120,0,40,.2));
  clip-path: polygon(0 0, 100% 0, 50% 100%); transform-origin: top center; will-change: transform; }
.seal { left: 50%; top: 56%; width: 56px; height: 56px; margin: -28px 0 0 -28px; z-index: 5; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 26px; color: rgba(110,0,20,.6); text-shadow: 0 1px 0 rgba(255,150,160,.6);
  background: radial-gradient(circle at 35% 30%, #ff6b7f, #c1122f 58%, #7d0a1d); box-shadow: 0 5px 9px rgba(0,0,0,.4), inset 0 -4px 6px rgba(0,0,0,.3), inset 0 3px 4px rgba(255,255,255,.35); }
.addr { left: 0; right: 0; bottom: 9%; z-index: 4; font-size: 32px; font-weight: 700; color: #fff; text-shadow: 0 2px 3px rgba(90,0,30,.45); }
.stamp { right: 6%; bottom: 8%; width: 44px; height: 52px; z-index: 4; background: #fffaf5; border: 2px dashed #ff9db8; border-radius: 3px; display: flex; align-items: center; justify-content: center; font-size: 22px; transform: rotate(6deg); box-shadow: 0 2px 4px rgba(0,0,0,.25); }
.post { left: 6%; bottom: 8%; font-size: 15px; font-weight: 700; color: rgba(255,255,255,.9); border: 1.5px solid rgba(255,255,255,.7); border-radius: 50%; width: 46px; height: 46px; display: flex; align-items: center; justify-content: center; z-index: 4; transform: rotate(-12deg); }
.fade { transition: opacity .35s ease; }

/* opening motion: flap swings up, then goes behind, letter rises */
.flap { transition: transform .8s cubic-bezier(.4, 0, .2, 1); }
.note { transition: transform 1.1s cubic-bezier(.25, .8, .3, 1); }
.stage.open .flap { transform: rotateX(180deg); }
.stage.back .flap { z-index: 1; }
.stage.open .seal, .stage.open .addr, .stage.open .stamp, .stage.open .post { opacity: 0; }
.stage.rise .note { transform: translateY(-44%); }

#openBtn { font-size: 30px; font-weight: 700; color: #fff; background: linear-gradient(180deg, #e63950, #b5123a); border: 0; border-radius: 999px; padding: 10px 46px; box-shadow: 0 10px 22px rgba(201,24,74,.45), inset 0 2px 0 rgba(255,255,255,.35); cursor: pointer; transition: transform .2s, opacity .3s; }
#openBtn:active { transform: scale(.95); }
#openBtn:focus-visible { outline: 3px solid var(--pink); outline-offset: 3px; }
.hint { margin: 10px 0 0; font-size: 18px; opacity: .8; }

.burst { position: fixed; z-index: 6; font-size: 24px; pointer-events: none; will-change: transform; animation: pop 1.4s ease-out forwards; }
@keyframes pop { from { transform: translate(0,0) scale(.4); opacity: 1; } to { transform: translate(var(--x), var(--y)) scale(1.3) rotate(30deg); opacity: 0; } }

/* ---------- scrapbook page ---------- */
#scrap { position: fixed; inset: 0; z-index: 7; background: #f6ece0; overflow: hidden; opacity: 0; visibility: hidden; transition: opacity 1s ease, visibility 0s linear 1s; }
#scrap.show { opacity: 1; visibility: visible; transition-delay: 0s; }
#scrap .sheet { position: absolute; left: 50%; top: 50%; width: max(100vw, calc(100dvh * 0.5625)); aspect-ratio: 1152 / 2048; transform: translate(-50%, -50%); }
#scrap img { position: absolute; display: block; }
#tpl { inset: 0; width: 100%; height: 100%; }
.pol { left: 16%; top: 33.2%; width: 68%; padding: 1.8% 1.8% 1.8%; background: #fff; box-shadow: 0 10px 24px rgba(60,20,10,.4); transform: rotate(-1.5deg) scale(.9); opacity: 0; }
.pol img { position: static; width: 100%; }
#scrap.show .pol { animation: develop 1.8s ease .9s forwards; }
@keyframes develop { 0% { opacity: 0; transform: rotate(-4deg) scale(.82); filter: blur(8px); } 100% { opacity: 1; transform: rotate(-1.5deg) scale(1); filter: blur(0); } }
#goBtn { position: absolute; left: 50%; bottom: calc(26px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); font-size: 28px; font-weight: 700; color: #fff; background: linear-gradient(180deg, #c9184a, #8f0d33); border: 0; border-radius: 999px; padding: 8px 38px; box-shadow: 0 8px 18px rgba(90,0,30,.45); cursor: pointer; opacity: 0; }
#scrap.show #goBtn { animation: fadeIn 1s ease 3s forwards; }
@keyframes fadeIn { to { opacity: 1; } }

/* ---------- hero ---------- */
.pre { font-size: clamp(24px, 7vw, 34px); font-weight: 700; line-height: 1.15; margin: 0; }
.big { font-size: clamp(72px, 22vw, 104px); font-weight: 700; line-height: 1; margin: 0; color: var(--red); text-shadow: 0 3px 0 rgba(255,255,255,.7), 0 8px 18px rgba(201,24,74,.3); }
.pik { font-size: clamp(44px, 13vw, 60px); font-weight: 700; margin: 2px 0 8px; color: var(--red); }
.since { font-size: 20px; margin: 0 0 18px; opacity: .9; }
.row { display: grid; gap: 10px; grid-template-columns: repeat(3, 1fr); width: min(100%, 400px); margin-bottom: 10px; }
.unit { background: var(--card); border: 1px solid rgba(201,24,74,.25); border-radius: 18px; padding: 12px 4px 8px; box-shadow: 0 6px 14px rgba(120,20,60,.12); }
.unit b { display: block; font-size: 58px; font-weight: 700; color: var(--red); line-height: 1.05; }
.unit span { font-size: 17px; font-weight: 700; }
.small .unit { padding: 8px 4px 6px; border-radius: 14px; }
.small .unit b { font-size: 36px; }
.flip { animation: flip .45s ease; }
@keyframes flip { 0% { transform: rotateX(90deg); opacity: .2; } 100% { transform: rotateX(0); opacity: 1; } }
.nick { font-size: 28px; font-weight: 700; margin: 16px 0 4px; }
.tiny { font-size: 17px; opacity: .85; margin: 0 0 40px; }


/* ---------- story ---------- */
.btn2 { margin: 0 0 40px; font-size: 28px; font-weight: 700; color: #fff; background: linear-gradient(180deg, #e63950, #b5123a); border: 0; border-radius: 999px; padding: 10px 40px; box-shadow: 0 10px 22px rgba(201,24,74,.4), inset 0 2px 0 rgba(255,255,255,.35); cursor: pointer; }
.btn2:active { transform: scale(.95); }
#story { position: fixed; inset: 0; z-index: 8; background: #f1e3d3; opacity: 0; visibility: hidden; transition: opacity .8s ease, visibility 0s linear .8s; }
#story.show { opacity: 1; visibility: visible; transition-delay: 0s; }
#slides { height: 100%; overflow-y: auto; scroll-snap-type: y mandatory; -webkit-overflow-scrolling: touch; }
.slide { height: 100vh; height: 100dvh; scroll-snap-align: start; scroll-snap-stop: always; display: flex; justify-content: center; }

.body { position: absolute; left: 15%; right: 17%; top: calc(16% + env(safe-area-inset-top, 0px) * .4); bottom: 28%; display: flex; flex-direction: column; align-items: center; text-align: center; color: #5a1230; }
.body > * { opacity: 0; transform: translateY(14px); transition: opacity .8s ease, transform .8s ease; }
.slide.in .body > * { opacity: 1; transform: none; }
.slide.in .body > *:nth-child(2) { transition-delay: .15s; }
.slide.in .body > *:nth-child(3) { transition-delay: .3s; }
.slide.in .body > *:nth-child(4) { transition-delay: .5s; }
.d { font-size: 28px; font-weight: 700; color: #c9184a; line-height: 1; }
.t { font-size: clamp(30px, 9vw, 40px); font-weight: 700; line-height: 1.05; margin: 4px 0 6px; }
.c { text-transform: none; font-size: 22px; line-height: 1.2; font-weight: 600; margin-top: 8px; }
.pics { position: relative; width: 100%; flex: 1 1 auto; min-height: 150px; margin-top: 8px; }
.ph { position: absolute; width: 52%; background: #fff; padding: 5px 5px 16px; box-shadow: 0 8px 16px rgba(60,20,10,.35); }
.ph img { display: block; width: 100%; }
.ph::before { content: ""; position: absolute; top: -9px; left: 50%; width: 46px; height: 16px; margin-left: -23px; background: rgba(255,244,224,.85); box-shadow: 0 1px 3px rgba(0,0,0,.2); transform: rotate(-4deg); }
.ph.L { width: 62%; }
.ph.n0 { left: 0; top: 0; }
.ph.n1 { right: 0; bottom: 0; }
.ph.only { position: relative; margin: 0 auto; }
.body.txt { justify-content: center; }
.txt .d { font-size: 84px; }
.orn { font-size: 54px; margin: 8px 0; }
.swipe { position: absolute; left: 50%; bottom: calc(-14% + 0px); transform: translateX(-50%); font-size: 22px; font-weight: 700; color: #fff; text-shadow: 0 1px 4px rgba(90,0,30,.8); animation: nudge 1.6s ease-in-out infinite; white-space: nowrap; }
@keyframes nudge { 0%, 100% { margin-bottom: 0; } 50% { margin-bottom: 10px; } }
.again { margin-top: 14px; font-size: 24px; font-weight: 700; color: #fff; background: #b5123a; border: 0; border-radius: 999px; padding: 8px 28px; box-shadow: 0 6px 14px rgba(90,0,30,.4); cursor: pointer; }
#backBtn, #count { position: absolute; z-index: 2; top: calc(12px + env(safe-area-inset-top, 0px)); background: rgba(255,250,245,.85); color: #5a1230; border: 0; border-radius: 999px; font-size: 22px; font-weight: 700; padding: 4px 14px; box-shadow: 0 2px 8px rgba(0,0,0,.2); }
#backBtn { left: 12px; cursor: pointer; }
#count { right: 12px; }
@media (prefers-reduced-motion: reduce) { .body > *, #story { transition-duration: .01s; transition-delay: 0s; } .swipe { animation: none; } }

@media (prefers-reduced-motion: reduce) {
  #bg .h, #bg .w, #bg .sp, #bg .pt, .lily { animation: none; }
  .flap, .note, #hero, #scrap { transition-duration: .01s; transition-delay: 0s; }
  .burst, .flip { animation: none; }
  #scrap.show .pol { animation: none; opacity: 1; transform: rotate(-1.5deg); }
  #scrap.show #goBtn { animation: none; opacity: 1; }
}
</style>

    var by = top + stemH * 0.4;

    svg += '<use href="#bud" transform="translate(' + (cx + 20) + ' ' + (by - 4) + ') rotate(38)"/>';
  }
  svg += '<g transform="rotate(' + rnd(-12, 12) + ' ' + cx + ' ' + top + ') translate(' + (cx - bs / 2) + ' ' + (top - bs / 2) + ') scale(' + (bs / 100) + ')"><use href="#bloom"/></g>';
  return svg + '</svg>';
}

// ----- opening sequence -----
var stage = document.getElementById("stage");
var intro = document.getElementById("intro");
var scrap = document.getElementById("scrap");
var hero = document.getElementById("hero");
var clicked = false;

function burst() {
  var r = stage.getBoundingClientRect();
  var cx = r.left + r.width / 2, cy = r.top + r.height / 2;
  for (var n = 0; n < 20; n++) {
    var b = document.createElement("span");
    b.className = "burst";
    b.textContent = hearts[n % hearts.length];
    b.style.left = cx + "px";
    b.style.top = cy + "px";
    b.style.setProperty("--x", rnd(-170, 170) + "px");
    b.style.setProperty("--y", rnd(-260, 40) + "px");
    document.body.appendChild(b);
    setTimeout(b.remove.bind(b), 1500);
  }
}

document.getElementById("openBtn").addEventListener("click", function () {
  if (clicked) return;
  clicked = true;
  this.style.opacity = "0";
  stage.classList.add("open");                                    // flap swings up
  setTimeout(function () { stage.classList.add("back"); }, 400);  // flap goes behind while edge-on, so no flicker
  setTimeout(function () { stage.classList.add("rise"); }, 700);  // letter rises
  setTimeout(burst, 1200);
  setTimeout(function () { scrap.classList.add("show"); }, 2300); // scrapbook page fades in
  setTimeout(function () { intro.style.display = "none"; }, 3500);
});

document.getElementById("goBtn").addEventListener("click", function () {
  scrap.classList.remove("show");
  hero.classList.add("show");
});

var story = document.getElementById("story");
var wrap = document.getElementById("slides");
var countEl = document.getElementById("count");

for (var si = 0; si < slides.length; si++) {
  var sl = slides[si];
  var pics = "";
  if (sl.p) {
    for (var pi = 0; pi < sl.p.length; pi++) {
      var pp = sl.p[pi];
      var cls = "ph " + pp[1] + (sl.p.length === 1 ? " only" : " n" + pi);
      pics += '<div class="' + cls + '" style="transform:rotate(' + pp[2] + 'deg)"><img src="' + IMG[pp[0]] + '" alt=""></div>';
    }
  }
  var html = '<div class="page"><div class="body' + (sl.p ? "" : " txt") + '">' +
    '<div class="d">' + sl.d + '</div><div class="t">' + sl.t + '</div>' +
    (sl.p ? '<div class="pics">' + pics + '</div>' : '<div class="orn">' + sl.e + '</div>') +
    '<div class="c">' + sl.c + '</div>' +
    (sl.last ? '<button class="again">Back to the start 💗</button>' : '') +
    (si === 0 ? '<div class="swipe">swipe up ↑</div>' : '') + '</div></div>';
  var slide = document.createElement("div");
  slide.className = "slide";
  slide.setAttribute("data-i", si);
  slide.innerHTML = html;
  wrap.appendChild(slide);
}

var io = new IntersectionObserver(function (entries) {
  entries.forEach(function (en) {
    if (en.isIntersecting) {
      en.target.classList.add("in");
      countEl.textContent = (+en.target.getAttribute("data-i") + 1) + " / " + slides.length;
    }
  });
}, { root: wrap, threshold: 0.6 });
var all = wrap.querySelectorAll(".slide");
for (var ai = 0; ai < all.length; ai++) io.observe(all[ai]);

document.getElementById("storyBtn").addEventListener("click", function () {
  wrap.scrollTop = 0;
  story.classList.add("show");
});
function leaveStory() { story.classList.remove("show"); }
document.getElementById("backBtn").addEventListener("click", leaveStory);
wrap.querySelector(".again").addEventListener("click", function () { hero.scrollTop = 0; leaveStory(); });

// ----- live counter (Indian time) -----
var names = ["Months", "Weeks", "Days", "Hours", "Minutes", "Seconds"];
var nums = [], last = [];
for (var j = 0; j < names.length; j++) {
  var box = document.createElement("div");
  box.className = "unit";
  var n = document.createElement("b");
  n.textContent = "0";
  var l = document.createElement("span");
  l.textContent = names[j];
  box.appendChild(n);
  box.appendChild(l);
  document.getElementById(j < 3 ? "rowBig" : "rowSmall").appendChild(box);
  nums.push(n);
  last.push(-1);
}

var IST = 19800000;
var start = new Date(new Date(startTime).getTime() + IST);

function anchor(m) {
  return Date.UTC(start.getUTCFullYear(), start.getUTCMonth() + m, start.getUTCDate(),
    start.getUTCHours(), start.getUTCMinutes(), start.getUTCSeconds());
}

function tick() {
  var now = new Date(Date.now() + IST);
  var months = (now.getUTCFullYear() - start.getUTCFullYear()) * 12 + (now.getUTCMonth() - start.getUTCMonth());
  if (anchor(months) > now.getTime()) months--;
  if (months < 0) months = 0;
  var rest = Math.max(0, now.getTime() - anchor(months));
  var day = 86400000;
  var weeks = Math.floor(rest / (7 * day)); rest -= weeks * 7 * day;
  var days = Math.floor(rest / day); rest -= days * day;
  var hours = Math.floor(rest / 3600000); rest -= hours * 3600000;
  var mins = Math.floor(rest / 60000); rest -= mins * 60000;
  var secs = Math.floor(rest / 1000);
  var vals = [months, weeks, days, hours, mins, secs];
  for (var k = 0; k < vals.length; k++) {
    if (vals[k] !== last[k]) {
      nums[k].textContent = vals[k];
      last[k] = vals[k];
      nums[k].classList.remove("flip");
      void nums[k].offsetWidth;
      nums[k].classList.add("flip");
    }
  }
}
tick();
setInterval(tick, 1000);
</script>
